services:
  # Validate committed demo/user data before starting the application.
  data-check:
    image: node:22-alpine
    working_dir: /project
    volumes:
      - ./:/project:ro
    command: ["sh", "-c", "node scripts/verify-version.mjs && node scripts/validate_static_user_data.mjs && node scripts/validate_full_dataset.mjs"]
    restart: "no"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ticket-db
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      POSTGRES_DB: "${DB_NAME:-ticket_reservation}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket-backend
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      APP_ENV: "${APP_ENV:-development}"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      DB_NAME: "${DB_NAME:-ticket_reservation}"
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      EMAIL_DOMAIN_CHECK: "${EMAIL_DOMAIN_CHECK:-true}"
      EMAIL_DNS_TIMEOUT_SECONDS: "${EMAIL_DNS_TIMEOUT_SECONDS:-4}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      DEMO_ADMIN_STUDENT_ID: "${DEMO_ADMIN_STUDENT_ID:-4000000001}"
      DEMO_ADMIN_EMAIL: "${DEMO_ADMIN_EMAIL:-ticket.reservation.demo+system-admin@gmail.com}"
      DEMO_ADMIN_PASSWORD: "${DEMO_ADMIN_PASSWORD:-}"
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      data-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # One-shot full dataset loader. Run with:
  # docker compose --profile seed run --rm full-data
  full-data:
    image: postgres:16-alpine
    profiles: ["seed"]
    environment:
      PGPASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      DEMO_DATA_PASSWORD: "${DEMO_DATA_PASSWORD:?DEMO_DATA_PASSWORD must be set in .env}"
    volumes:
      - ./scripts/seed_full_dataset.sql:/seed/seed_full_dataset.sql:ro
    command: ["sh", "-ec", "exec psql -X -v ON_ERROR_STOP=1 -v demo_password=\"$$DEMO_DATA_PASSWORD\" -h postgres -U \"${DB_USER:-postgres}\" -d \"${DB_NAME:-ticket_reservation}\" -f /seed/seed_full_dataset.sql"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
