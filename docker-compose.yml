services:
  # Validate committed demo/user data before starting the application.
  data-check:
    image: node:22-alpine
    working_dir: /project
    volumes:
      - ./:/project:ro
    command: ["sh", "-c", "node scripts/validate_static_user_data.mjs && node scripts/validate_full_dataset.mjs"]
    restart: "no"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ticket-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_reservation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket-backend
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ticket_reservation
      DB_SSLMODE: disable
      JWT_SECRET: ticket-reservation-secret-key-2025
      JWT_EXPIRY_HOURS: "24"
      EMAIL_DOMAIN_CHECK: "true"
      EMAIL_DNS_TIMEOUT_SECONDS: "4"
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      data-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # One-shot full dataset loader. Run with:
  # docker compose --profile seed run --rm full-data
  full-data:
    image: postgres:16-alpine
    profiles: ["seed"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./scripts/seed_full_dataset.sql:/seed/seed_full_dataset.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "postgres", "-d", "ticket_reservation", "-f", "/seed/seed_full_dataset.sql"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
