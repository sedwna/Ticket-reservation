name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:version
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          check-latest: true
      - run: go mod download
      - run: go mod tidy
      - name: Capture normalized module lock
        uses: actions/upload-artifact@v6
        with:
          name: normalized-go-modules
          path: |
            backend/go.mod
            backend/go.sum
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
      - name: Ensure Go modules are tidy
        run: git diff --exit-code -- go.mod go.sum

  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/verify-version.mjs
      - run: node scripts/validate_static_user_data.mjs
      - run: node scripts/validate_full_dataset.mjs
      - name: Reject committed secrets and generated files
        shell: bash
        run: |
          if git grep -n -E 'REMOVED_SECRET|REMOVED_SECRET|REMOVED_SECRET|REMOVED_SECRET'; then
            echo 'Known credentials are present in the repository.' >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|.*\.sqlite$|tmp_|docker_.*\.txt$|prj-report|backend/uploads/.+)' | grep -v 'backend/uploads/.gitkeep'; then
            echo 'Generated runtime files are tracked.' >&2
            exit 1
          fi
